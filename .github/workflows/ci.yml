name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AppuntaMed.slnx

      - name: Build
        run: dotnet build AppuntaMed.slnx --configuration Release --no-restore

      # Fast tests first: they need no Docker.
      - name: Unit tests
        run: >
          dotnet test AppuntaMed.Tests
          --configuration Release --no-build
          --filter "Category!=Integration"
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit
          --logger "trx;LogFileName=unit.trx"

      # The API on a real SQL Server (Testcontainers). GitHub's Ubuntu runners already have Docker.
      - name: Integration tests (SQL Server in Docker)
        if: ${{ !cancelled() }}
        run: >
          dotnet test AppuntaMed.Tests
          --configuration Release --no-build
          --filter "Category=Integration"
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration
          --logger "trx;LogFileName=integration.trx"

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;TextSummary;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage/
          if-no-files-found: warn

  docker-stack:
    name: Docker stack (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose --env-file .env.example config --quiet

      - name: Start the stack (API, SQL Server, Keycloak, Mailpit)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Container logs (only when something failed)
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
